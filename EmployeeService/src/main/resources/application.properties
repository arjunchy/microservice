spring.application.name=employee-service
server.address=127.0.0.1
server.port=8081

app.datasource.employee.jdbc-url=jdbc:mysql://localhost:3306/employee_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
app.datasource.employee.username=${EMPLOYEE_DB_USERNAME:root}
app.datasource.employee.password=${EMPLOYEE_DB_PASSWORD:mysql}
app.datasource.employee.driver-class-name=com.mysql.cj.jdbc.Driver
app.datasource.employee.hikari.maximum-pool-size=10

app.datasource.address.jdbc-url=jdbc:mysql://localhost:3306/address_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
app.datasource.address.username=${ADDRESS_RO_DB_USERNAME:root}
app.datasource.address.password=${ADDRESS_RO_DB_PASSWORD:mysql}
app.datasource.address.driver-class-name=com.mysql.cj.jdbc.Driver
app.datasource.address.hikari.read-only=true
app.datasource.address.hikari.maximum-pool-size=5

spring.jpa.open-in-view=false

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka
eureka.instance.hostname=localhost

jwt.secret=a3f1b8d4c9e2f706b8a9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f
jwt.expiration=86400000
